services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: email-outreach-rabbitmq
    hostname: rabbitmq
    env_file:
      - ./src/local_infrastructure/rabbit_mq/.env
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./src/local_infrastructure/rabbit_mq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./src/local_infrastructure/rabbit_mq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Publish Mongo on the host loopback only so local GUIs (Compass, mongosh, IDE)
  # use mongodb://127.0.0.1:<port>/ — other containers still use hostname `mongo`.
  mongo:
    image: mongo:7
    container_name: email-outreach-mongo
    hostname: mongo
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Orchestrator-owned: per-campaign pipeline status (orchestrator_service_role.md §2.1).
  postgres:
    image: postgres:16-alpine
    container_name: email-outreach-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
      POSTGRES_DB: ${POSTGRES_DB:-email_outreach}
    # No host port binding by default — orchestrator (when running) reaches
    # postgres at postgres:5432 inside the docker network. Uncomment to expose
    # for local psql/GUI access:
    # ports:
    #   - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchestrator} -d ${POSTGRES_DB:-email_outreach}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  planning:
    build:
      context: .
      dockerfile: src/planning/Dockerfile
    container_name: email-outreach-planning
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - ./src/planning/.env
    environment:
      # LLM keys read from root .env so they're set in one place. These override
      # any GEMINI_API_KEY / etc. in src/planning/.env (which should be empty).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

  sourcing:
    build:
      context: ./src
      dockerfile: sourcing/Dockerfile
    container_name: email-outreach-sourcing
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - ./src/sourcing/.env
      - ./src/local_infrastructure/rabbit_mq/.env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBIT_PREFETCH: "10"
      LOG_LEVEL: INFO
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: email_outreach
    restart: unless-stopped

  messaging:
    build:
      context: ./src
      dockerfile: messaging/Dockerfile
    container_name: email-outreach-messaging
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - ./src/messaging/.env
      - ./src/local_infrastructure/rabbit_mq/.env
    environment:
      BROKER_TYPE: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: email_outreach
      # LLM keys from root .env — single source of truth.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8081:8081"
    restart: unless-stopped

  prospecting:
    build:
      context: ./src
      dockerfile: prospecting/Dockerfile
    container_name: email-outreach-prospecting
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: email_outreach.events
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: email_outreach
      WAIT_FOR_DEPS: "true"
      STARTUP_RETRIES: "45"
      STARTUP_SLEEP_SECONDS: "2"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8004"
      LOG_LEVEL: INFO
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  observability:
    build:
      context: ./src
      dockerfile: observability/Dockerfile
    container_name: email-outreach-observability
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: email_outreach
      LOG_LEVEL: INFO
    ports:
      - "8090:8090"
    restart: unless-stopped

  # TS gateway service for the web UI. Owns campaigns Mongo collection and
  # campaign_status Postgres table, publishes the *.requested events.
  # The hostname `gateway` is the alias nginx in the web container expects.
  orchestrator:
    build:
      context: ./src
      dockerfile: orchestrator/Dockerfile
    container_name: email-outreach-orchestrator
    hostname: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017/email_outreach
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      POSTGRES_URL: postgres://${POSTGRES_USER:-orchestrator}:${POSTGRES_PASSWORD:-orchestrator}@postgres:5432/${POSTGRES_DB:-email_outreach}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Operator + marketing web app. SPA served by nginx; nginx also proxies
  # /api/* to the gateway service (override target via GATEWAY_URL env).
  web:
    build:
      context: ./src
      dockerfile: web-ui/Dockerfile
      args:
        # Empty → the SPA hits /api/* on the same origin (nginx proxies to GATEWAY_URL).
        # Set to e.g. http://gateway:8000 to bypass the proxy at build time.
        VITE_API_BASE_URL: ""
    container_name: email-outreach-web
    depends_on:
      orchestrator:
        condition: service_started
    environment:
      GATEWAY_URL: "http://gateway:3000"
    ports:
      - "8082:8082"
    restart: unless-stopped

volumes:
  rabbitmq_data:
  mongo_data:
  postgres_data:
