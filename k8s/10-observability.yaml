apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability
  namespace: email-outreach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability
  template:
    metadata:
      labels:
        app: observability
        monitor: "true"
    spec:
      containers:
        - name: observability
          image: 561517126105.dkr.ecr.us-west-2.amazonaws.com/observability:latest
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017"
            - name: MONGO_DB_NAME
              value: "email_outreach"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: observability
  namespace: email-outreach
  labels:
    monitor: "true"
spec:
  selector:
    app: observability
  ports:
    - port: 8090
      targetPort: 8090
      name: http
