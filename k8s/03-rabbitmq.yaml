        { "name": "sourcing.completed",     "vhost": "/", "durable": true, "auto_delete": false, "arguments": { "x-dead-letter-exchange": "email_outreach.dlx", "x-dead-letter-routing-key": "sourcing.completed.dlq" } },
        { "name": "sourcing.partial",       "vhost": "/", "durable": true, "auto_delete": false, "arguments": { "x-dead-letter-exchange": "email_outreach.dlx", "x-dead-letter-routing-key": "sourcing.partial.dlq" } },
        { "name": "prospecting.completed",  "vhost": "/", "durable": true, "auto_delete": false, "arguments": { "x-dead-letter-exchange": "email_outreach.dlx", "x-dead-letter-routing-key": "prospecting.completed.dlq" } },
        { "name": "draft.written",          "vhost": "/", "durable": true, "auto_delete": false, "arguments": { "x-dead-letter-exchange": "email_outreach.dlx", "x-dead-letter-routing-key": "draft.written.dlq" } },
        { "name": "draft.failed",           "vhost": "/", "durable": true, "auto_delete": false, "arguments": { "x-dead-letter-exchange": "email_outreach.dlx", "x-dead-letter-routing-key": "draft.failed.dlq" } },
        { "name": "campaign.completed",     "vhost": "/", "durable": true, "auto_delete": false, "arguments": { "x-dead-letter-exchange": "email_outreach.dlx", "x-dead-letter-routing-key": "campaign.completed.dlq" } },
        { "name": "plan.requested.dlq",         "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} },
        { "name": "sourcing.requested.dlq",     "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} },
        { "name": "prospecting.requested.dlq",  "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} },
        { "name": "messaging.requested.dlq",    "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} },
        { "name": "plan.ready.dlq",             "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} },
        { "name": "sourcing.completed.dlq",     "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} },
        { "name": "sourcing.partial.dlq",       "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} },
        { "name": "prospecting.completed.dlq",  "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} },
        { "name": "draft.written.dlq",          "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} },
        { "name": "draft.failed.dlq",           "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} },
