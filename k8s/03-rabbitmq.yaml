apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: email-outreach
data:
  rabbitmq.conf: |
    management.load_definitions = /etc/rabbitmq/definitions.json
    loopback_users.guest = false
  definitions.json: |
    {
      "rabbit_version": "3.13.0",
      "users": [
        {
          "name": "guest",
          "password_hash": "cJ6rf+XPiUu4Sbww8oJjqM1GqL6oJ65fXNeIW9Qmk2aIlZTf",
          "hashing_algorithm": "rabbit_password_hashing_sha256",
          "tags": ["administrator"],
          "limits": {}
        }
      ],
      "permissions": [
        {
          "user": "guest",
          "vhost": "/",
          "configure": ".*",
          "write": ".*",
          "read": ".*"
        }
      ],
      "vhosts": [{ "name": "/" }],
      "exchanges": [
        {
          "name": "email_outreach.events",
          "vhost": "/",
          "type": "topic",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        },
