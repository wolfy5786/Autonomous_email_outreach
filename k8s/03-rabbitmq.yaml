        { "source": "email_outreach.events", "vhost": "/", "destination": "messaging.requested",   "destination_type": "queue", "routing_key": "messaging.requested",   "arguments": {} },
        { "source": "email_outreach.events", "vhost": "/", "destination": "plan.ready",            "destination_type": "queue", "routing_key": "plan.ready",            "arguments": {} },
        { "source": "email_outreach.events", "vhost": "/", "destination": "sourcing.completed",    "destination_type": "queue", "routing_key": "sourcing.completed",    "arguments": {} },
        { "source": "email_outreach.events", "vhost": "/", "destination": "sourcing.partial",      "destination_type": "queue", "routing_key": "sourcing.partial",      "arguments": {} },
        { "source": "email_outreach.events", "vhost": "/", "destination": "prospecting.completed", "destination_type": "queue", "routing_key": "prospecting.completed", "arguments": {} },
        { "source": "email_outreach.events", "vhost": "/", "destination": "draft.written",         "destination_type": "queue", "routing_key": "draft.written",         "arguments": {} },
        { "source": "email_outreach.events", "vhost": "/", "destination": "draft.failed",          "destination_type": "queue", "routing_key": "draft.failed",          "arguments": {} },
        { "source": "email_outreach.events", "vhost": "/", "destination": "campaign.completed",    "destination_type": "queue", "routing_key": "campaign.completed",    "arguments": {} },
        { "source": "email_outreach.dlx", "vhost": "/", "destination": "plan.requested.dlq",        "destination_type": "queue", "routing_key": "plan.requested.dlq",        "arguments": {} },
        { "source": "email_outreach.dlx", "vhost": "/", "destination": "sourcing.requested.dlq",    "destination_type": "queue", "routing_key": "sourcing.requested.dlq",    "arguments": {} },
        { "source": "email_outreach.dlx", "vhost": "/", "destination": "prospecting.requested.dlq", "destination_type": "queue", "routing_key": "prospecting.requested.dlq", "arguments": {} },
        { "source": "email_outreach.dlx", "vhost": "/", "destination": "messaging.requested.dlq",   "destination_type": "queue", "routing_key": "messaging.requested.dlq",   "arguments": {} },
        { "source": "email_outreach.dlx", "vhost": "/", "destination": "plan.ready.dlq",            "destination_type": "queue", "routing_key": "plan.ready.dlq",            "arguments": {} },
        { "source": "email_outreach.dlx", "vhost": "/", "destination": "sourcing.completed.dlq",    "destination_type": "queue", "routing_key": "sourcing.completed.dlq",    "arguments": {} },
        { "source": "email_outreach.dlx", "vhost": "/", "destination": "sourcing.partial.dlq",      "destination_type": "queue", "routing_key": "sourcing.partial.dlq",      "arguments": {} },
        { "source": "email_outreach.dlx", "vhost": "/", "destination": "prospecting.completed.dlq", "destination_type": "queue", "routing_key": "prospecting.completed.dlq", "arguments": {} },
        { "source": "email_outreach.dlx", "vhost": "/", "destination": "draft.written.dlq",         "destination_type": "queue", "routing_key": "draft.written.dlq",         "arguments": {} },
        { "source": "email_outreach.dlx", "vhost": "/", "destination": "draft.failed.dlq",          "destination_type": "queue", "routing_key": "draft.failed.dlq",          "arguments": {} },
        { "source": "email_outreach.dlx", "vhost": "/", "destination": "campaign.completed.dlq",    "destination_type": "queue", "routing_key": "campaign.completed.dlq",    "arguments": {} }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: email-outreach
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp2
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: email-outreach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: config
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: email-outreach
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
