# FILL IN all REPLACE_ME values before applying.
# Never commit real credentials — use kubectl create secret or AWS Secrets Manager instead.
#
# Quick create (preferred over applying this file):
#   kubectl create secret generic app-secrets -n email-outreach \
#     --from-literal=GEMINI_API_KEY=xxx \
#     --from-literal=OPENAI_API_KEY=xxx \
#     --from-literal=ANTHROPIC_API_KEY=xxx \
#     --from-literal=SERPAPI_API_KEY=xxx
#
#   kubectl create secret generic postgres-secret -n email-outreach \
#     --from-literal=POSTGRES_USER=orchestrator \
#     --from-literal=POSTGRES_PASSWORD=orchestrator
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: email-outreach
type: Opaque
stringData:
  GEMINI_API_KEY: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
  SERPAPI_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: email-outreach
type: Opaque
stringData:
  POSTGRES_USER: "orchestrator"
  POSTGRES_PASSWORD: "orchestrator"
  POSTGRES_URL: "postgres://orchestrator:orchestrator@postgres:5432/email_outreach"
