# The nginx.conf baked into the image uses Docker's DNS resolver (127.0.0.11).
# This ConfigMap replaces it with a K8s-compatible config that proxies /api/* directly
# to the orchestrator service. Mounted at /etc/nginx/conf.d/default.conf.
# The Deployment overrides the entrypoint to skip nginx's envsubst template step.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-ui-nginx
  namespace: email-outreach
data:
  default.conf: |
    server {
      listen 8082;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
      }

      location /api/ {
        proxy_pass http://orchestrator:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
      }

      location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"gateway_unreachable","detail":"The orchestrator service is not yet ready."}';
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: email-outreach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      containers:
        - name: web-ui
          image: 561517126105.dkr.ecr.us-west-2.amazonaws.com/web-ui:latest
          # Skip the envsubst template entrypoint — we mount our own config directly.
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - containerPort: 8082
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: web-ui-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: email-outreach
spec:
  type: LoadBalancer
  selector:
    app: web-ui
  ports:
    - port: 80
      targetPort: 8082
      name: http
