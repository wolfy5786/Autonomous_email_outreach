apiVersion: apps/v1
kind: Deployment
metadata:
  name: planning
  namespace: email-outreach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planning
  template:
    metadata:
      labels:
        app: planning
        monitor: "true"
    spec:
      containers:
        - name: planning
          image: 561517126105.dkr.ecr.us-west-2.amazonaws.com/planning:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672/"
            - name: RABBITMQ_EXCHANGE
              value: "email_outreach.events"
            - name: MONGO_URL
              value: "mongodb://mongo:27017"
            - name: MONGO_DB
              value: "email_outreach"
            - name: PLAN_REQUESTED_QUEUE
              value: "plan.requested"
            - name: PLAN_READY_QUEUE
              value: "plan.ready"
            - name: SOURCING_REQUESTED_QUEUE
              value: "sourcing.requested"
            - name: LLM_MODEL
              value: "gemini/gemini-1.5-pro"
            - name: LLM_TEMPERATURE
              value: "0.2"
            - name: LLM_MAX_TOKENS
              value: "4096"
            - name: LLM_TIMEOUT_SECONDS
              value: "60"
            - name: LLM_MAX_RETRIES
              value: "3"
            - name: HEALTH_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "INFO"
            - name: RABBIT_PREFETCH
              value: "10"
            - name: GRACEFUL_SHUTDOWN_SECONDS
              value: "30"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GEMINI_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ANTHROPIC_API_KEY
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: planning
  namespace: email-outreach
  labels:
    monitor: "true"
spec:
  selector:
    app: planning
  ports:
    - port: 8080
      targetPort: 8080
      name: http
