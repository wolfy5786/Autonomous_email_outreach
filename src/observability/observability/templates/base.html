<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Observability{% endblock %}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem auto; max-width: 960px; color: #1a1a1a; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; }
        .phase-start { color: #2563eb; }
        .phase-end { color: #16a34a; }
        .phase-error { color: #dc2626; font-weight: 600; }
        .phase-emit { color: #6b7280; }
        .muted { color: #6b7280; }
        .empty { color: #6b7280; font-style: italic; padding: 1rem; }
        code { background: #f1f5f9; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.85rem; }
        nav { margin-bottom: 1.5rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav><a href="/">← campaigns</a></nav>
    {% block content %}{% endblock %}
</body>
</html>
