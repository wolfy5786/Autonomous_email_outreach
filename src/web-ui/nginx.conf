server {
  listen 8082;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static assets — long cache for hashed Vite bundles.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API → gateway service.
  # Using docker's embedded DNS (127.0.0.11) + a variable for proxy_pass means
  # nginx does NOT resolve $upstream at startup. So the container starts even
  # when the gateway service is missing — requests just 502 until it's up.
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $upstream "${GATEWAY_URL}";
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    # Return a clear placeholder while the gateway service doesn't exist yet.
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_unavailable;
  }

  location @api_unavailable {
    default_type application/json;
    return 503 '{"error":"gateway_unreachable","detail":"The gateway service is not yet wired. Configure GATEWAY_URL to point at a running gateway."}';
  }

  # SPA fallback — every other route returns index.html so React Router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
