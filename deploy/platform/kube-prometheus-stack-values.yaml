# Prometheus + Grafana + Alertmanager overrides
# See cloud_INFRASTRUCTURE.md § Observability
prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          resources:
            requests:
              storage: 50Gi
grafana:
  adminPassword: "" # Sourced from ExternalSecret
