# Fluent Bit → CloudWatch Logs
# See cloud_INFRASTRUCTURE.md § Observability
config:
  outputs: |
    [OUTPUT]
        Name              cloudwatch_logs
        Match             *
        region            us-west-2
        log_group_name    /eks/email-outreach/${NAMESPACE}
        log_stream_prefix ${POD_NAME}-
        auto_create_group true
