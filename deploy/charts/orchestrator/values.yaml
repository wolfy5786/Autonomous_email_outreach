replicaCount: 1

image:
  repository: ""  # Set via CI: <account>.dkr.ecr.us-west-2.amazonaws.com/email-outreach/orchestrator
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

scaler:
  type: hpa       # hpa | keda
  minReplicas: 1
  maxReplicas: 4
  targetCPU: 70

serviceAccount:
  create: true
  annotations: {}
