replicaCount: 2

image:
  repository: ghcr.io/wolfy5786/orchestrator
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  - name: PORT
    value: "3000"
  - name: NODE_ENV
    value: "production"
  - name: RABBITMQ_URL
    valueFrom:
      secretKeyRef:
        name: orchestrator-secrets
        key: rabbitmq-url
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: orchestrator-secrets
        key: database-url
  - name: MONGO_URI
    valueFrom:
      secretKeyRef:
        name: orchestrator-secrets
        key: mongo-uri

livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10
