replicaCount: 2

image:
  repository: ghcr.io/wolfy5786/messaging
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8001

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

env:
  - name: RABBITMQ_URL
    valueFrom:
      secretKeyRef:
        name: messaging-secrets
        key: rabbitmq-url
  - name: MONGO_URI
    valueFrom:
      secretKeyRef:
        name: messaging-secrets
        key: mongo-uri
  - name: SMTP_HOST
    valueFrom:
      secretKeyRef:
        name: messaging-secrets
        key: smtp-host
  - name: SMTP_USER
    valueFrom:
      secretKeyRef:
        name: messaging-secrets
        key: smtp-user
  - name: SMTP_PASS
    valueFrom:
      secretKeyRef:
        name: messaging-secrets
        key: smtp-pass
